<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>社員評価</title>
<style>
:root{
  --bg:#f4f5f2;--card:#fff;--ink:#1e2320;--sub:#6a736d;--line:#dde2dd;--accent:#2f6b4f;--accent-ink:#fff;
  --soft:#e9f1ec;--warn:#b3412c;--warn-soft:#fbe9e5;--focus:#2f6b4f55;
  --rS:#8a5a00;--rSb:#fff0c7;--rA:#2f6b4f;--rAb:#dff0e6;--rB:#2d5a8a;--rBb:#e0ebf7;--rC:#6f4f86;--rCb:#eee4f4;--rD:#9a3a28;--rDb:#f7e1dc;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121514;--card:#1c201e;--ink:#e7ebe8;--sub:#99a29c;--line:#30362f;--accent:#62b089;--accent-ink:#0c1a12;
  --soft:#1f2e27;--warn:#e47c64;--warn-soft:#3a201b;--focus:#62b08966;
  --rS:#f2c14e;--rSb:#3a2e10;--rA:#7cc99f;--rAb:#1c3427;--rB:#86b4e6;--rBb:#1b2a3d;--rC:#c7a3e0;--rCb:#2e2238;--rD:#ef8f7a;--rDb:#3a1f19;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header.top .ttl{font-weight:700;font-size:17px}
header.top .who{color:var(--sub);font-size:13px}
header.top .sp{flex:1}
main{max-width:860px;margin:0 auto;padding:16px}
main.narrow{max-width:560px}
main.wide{max-width:1240px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--sub);font-size:14px;margin:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:15px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.wide{width:100%;padding:13px;font-size:16px;margin-top:12px}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:16px}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
label.lb{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login{width:100%;max-width:360px;text-align:center}
.login form{margin-top:16px}
.err{color:var(--warn);font-size:14px;margin:10px 0 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.row>.btn{flex:0 0 auto;min-width:0}
.list{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:640px){.list{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
@media (min-width:980px){.list{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:640px){
  .list .emp{flex-direction:column;align-items:stretch;gap:8px;min-height:104px}
  .list .emp .st{display:flex;align-items:center;gap:8px;margin-top:auto}
}
.emp .st{display:flex;align-items:center;gap:8px;flex-shrink:0}
.emp .nm,.emp .wp{overflow-wrap:anywhere}
.sbox{position:relative;flex:2 !important;min-width:200px !important}
.sbox input{padding-left:40px;font-size:17px;height:48px;border-width:2px}
.sbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}
.hit{font-size:13px;color:var(--sub);margin:-4px 0 10px}
@media (max-width:639px){.sbox{flex:1 1 100% !important}}
.emp{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.emp:hover{border-color:var(--accent)}
.emp.off{cursor:default;opacity:.6}.emp.off:hover{border-color:var(--line)}
.emp .nm{font-weight:700}.emp .wp{color:var(--sub);font-size:13px}
.emp .grow{flex:1;min-width:0}
.badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:700;white-space:nowrap}
.badge.gray{background:var(--bg);color:var(--sub);border:1px solid var(--line)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.rk{display:inline-flex;align-items:center;justify-content:center;font-weight:800;border-radius:8px;min-width:30px;height:30px;padding:0 6px}
.rk.S{color:var(--rS);background:var(--rSb)}.rk.A{color:var(--rA);background:var(--rAb)}.rk.B{color:var(--rB);background:var(--rBb)}.rk.C{color:var(--rC);background:var(--rCb)}.rk.D{color:var(--rD);background:var(--rDb)}
.rk.big{font-size:44px;min-width:84px;height:84px;border-radius:18px}
.item{border-top:1px solid var(--line);padding:14px 0}
.item:first-of-type{border-top:0;padding-top:4px}
.item .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.item .no{color:var(--accent);font-weight:800}
.item .nm{font-weight:700}
.item .mx{color:var(--sub);font-size:13px}
.item .ds{color:var(--sub);font-size:14px;margin:2px 0 8px}
.item.missing select{border-color:var(--warn);background:var(--warn-soft)}
.ded .pt{color:var(--warn);font-size:13px;font-weight:700}
.summary{display:flex;align-items:center;gap:18px}
.summary .tot{font-size:38px;font-weight:800;line-height:1}
.summary .tot small{font-size:16px;font-weight:600;color:var(--sub);margin-left:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--sub);font-weight:600;font-size:12px;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.zero td{color:var(--sub)}
tr.sum td{font-weight:800;border-bottom:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll table{min-width:640px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;font-size:14px}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--sub)}
.back{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;margin-bottom:10px;font-size:15px}
.note{font-size:13px;color:var(--sub);background:var(--bg);border-radius:10px;padding:10px 12px;margin:10px 0}
.scale{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:10px}
.scale span{display:inline-flex;align-items:center;gap:4px}
.scale .rk{min-width:22px;height:22px;font-size:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}#toast.bad{background:var(--warn);color:#fff}
.modal{position:fixed;inset:0;background:#0007;z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.modal .card{max-width:760px;width:100%;margin:0}
.loading{padding:60px 16px;text-align:center;color:var(--sub)}
.muted{color:var(--sub)}
.mt{margin-top:12px}
@media (max-width:520px){.summary .tot{font-size:32px}.rk.big{font-size:36px;min-width:70px;height:70px}}
</style>
</head>
<body>
<div id="app"><div class="loading">読み込み中…</div></div>
<div id="toast"></div>
<script>
// ===================== 設定（デプロイ時に書き換え） =====================
const SUPABASE_URL = 'https://wlmomylacenzgtvcoxlb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsbW9teWxhY2Vuemd0dmNveGxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNzE2MjUsImV4cCI6MjA5Njc0NzYyNX0.ld1XMUXd2tfU5AxdbTTcbTk5VZJ0UfcRI8FFDy9ALCc';
// 置換されたかどうかは「https:// で始まるか」で判定（置換文字列そのものとは比較しない）
const CONFIGURED = SUPABASE_URL.startsWith('https://');

// ===================== 評価基準 =====================
const ITEMS = [
  {name:'勤務姿勢・責任感', max:15, desc:'遅刻や欠勤の回数、責任を持って業務を遂行しているか'},
  {name:'衛生・安全管理',   max:20, desc:'HACCPや衛生ルール・事故防止・安全作業を徹底しているか'},
  {name:'業務遂行能力',     max:20, desc:'調理技術、正確性、作業効率、時間管理が適切であるか'},
  {name:'協調性',           max:15, desc:'周囲と協力し、円滑な職場づくりに取り組んでいるか'},
  {name:'顧客対応',         max:10, desc:'学校・園・施設等への対応が適切であるか'},
  {name:'コスト意識',       max:10, desc:'消耗品・時間・ロスの削減を意識している'},
  {name:'改善・会社貢献',   max:10, desc:'業務改善・積極的な応援業務・会社方針への協力がある'},
];
const DEDS = [
  {name:'本人都合による遅刻・欠勤', pt:2},
  {name:'無断欠勤・連絡手順を守らない欠勤', pt:10},
  {name:'手洗い・温度管理・記録に関する違反', pt:2},
  {name:'異物混入・食中毒に繋がりうる重大不備', pt:10},
  {name:'本人の対応・行為によるクレーム', pt:2},
  {name:'事故・トラブル・欠員等の必要な報告を怠った', pt:10},
  {name:'服務規律・安全手順・社内ルール等への違反', pt:5},
  {name:'改善指導後に同じ問題を起こした', pt:10},
];
const ROLES = {manager:'マネージャー', jicho:'次長', jigyobu:'事業部'};
const ROLE_ORDER = ['manager','jicho','jigyobu'];

function calc(items, ded){
  const plus = items.reduce((a,b)=>a+Number(b),0);
  const minus = (ded||[]).reduce((a,c,i)=>a+Number(c)*DEDS[i].pt,0);
  const total = Math.max(0, Math.round((plus-minus)*10)/10);
  const rank = total>=90?'S':total>=80?'A':total>=70?'B':total>=60?'C':'D';
  return {plus, minus, total, rank};
}
const norm = t => String(t||'').normalize('NFKC').replace(/[\s　]/g,'').replace(/[\u30a1-\u30f6]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60)).toLowerCase();
const empSub = e => [e.workplace, e.position].filter(Boolean).join('・');
const f1 = n => (Math.round(Number(n)*10)/10).toFixed(1);

// ===================== 共通 =====================
const $app = document.getElementById('app');
const st = {pass:null, token:null, mode:null, ev:null, list:null, q:'', wp:'', ust:'', adm:null, admTab:'eval', admPeriod:null, aq:'', awp:'', ast:''};
function save(){ try{ sessionStorage.setItem('bonus_s', JSON.stringify({pass:st.pass, token:st.token, mode:st.mode, ev:st.ev})); }catch(e){} }
function load(){ try{ const o = JSON.parse(sessionStorage.getItem('bonus_s')||'null'); if(o){ st.pass=o.pass; st.token=o.token; st.mode=o.mode; st.ev=o.ev; } }catch(e){} }
function logout(){ if (st.token) rpc('bonus_logout', {p_token:st.token}).catch(()=>{}); st.pass=st.token=st.mode=st.ev=st.list=st.adm=null; try{ sessionStorage.removeItem('bonus_s'); }catch(e){} showLogin(); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const $ = id => document.getElementById(id);
let toastTimer;
function toast(msg, bad){ const t=$('toast'); t.textContent=msg; t.className='show'+(bad?' bad':''); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.className='', 3200); }
function loading(){ $app.innerHTML = '<div class="loading">読み込み中…</div>'; }

async function rpc(fn, args){
  const headers = {'Content-Type':'application/json', apikey:SUPABASE_ANON_KEY};
  if (SUPABASE_ANON_KEY.startsWith('eyJ')) headers.Authorization = 'Bearer ' + SUPABASE_ANON_KEY;
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {method:'POST', headers, body:JSON.stringify(args||{})});
  const text = await r.text();
  let data = null; try{ data = text ? JSON.parse(text) : null; }catch(e){ data = text; }
  if (!r.ok){ const e = new Error((data && data.message) || r.statusText || 'ERROR'); e.code = data && data.message; throw e; }
  return data;
}
function errMsg(e){
  const m = (e && e.message) || '';
  const map = {
    AUTH:'パスワードが違います', NOT_INITIALIZED:'初期設定が完了していません（SQL未実行）',
    NO_EVALUATOR:'評価者が見つかりません。選び直してください', NO_PERIOD:'評価期間が設定されていません',
    NO_EMPLOYEE:'対象者が見つかりません', BAD_INPUT:'入力内容を確認してください',
    LOCKED:'3名の評価が完了しているため変更できません', TAKEN:'この対象者は同じ役職の別の評価者が評価済みです',
    PW_SHORT:'パスワードは8文字以上にしてください', PW_SAME:'管理者パスワードと同じものは使えません', PW_DUP:'他の評価者と同じパスワードは使えません',
  };
  if (map[m]) return map[m];
  if (/Failed to fetch|NetworkError/i.test(m)) return '通信できませんでした。電波状況を確認してください';
  if (/duplicate key/i.test(m)) return '同じ名前がすでに登録されています';
  if (/check constraint/i.test(m)) return '入力内容を確認してください（範囲外の値があります）';
  return 'エラーが発生しました：' + m;
}
async function guard(fn){
  try{ await fn(); }
  catch(e){
    if (e.message==='AUTH'){ logout(); toast('再度ログインしてください', true); return; }
    if (e.message==='NO_EVALUATOR'){ logout(); toast('再度ログインしてください', true); return; }
    toast(errMsg(e), true); console.error(e);
  }
}
function scaleHTML(){ return `<div class="scale">${[['S','90点以上'],['A','80〜89'],['B','70〜79'],['C','60〜69'],['D','59以下']].map(([r,t])=>`<span><b class="rk ${r}">${r}</b>${t}</span>`).join('')}</div>`; }

// ===================== ログイン =====================
function showLogin(msg){
  $app.innerHTML = `<div class="center"><div class="card login">
    <h1>社員評価</h1><p class="sub">パスワードを入力してください</p>
    <form id="f"><input type="password" id="pw" autocomplete="current-password" placeholder="パスワード" required>
    <button class="btn primary wide" id="lg">ログイン</button></form>
    ${msg?`<p class="err">${esc(msg)}</p>`:''}</div></div>`;
  $('pw').focus();
  $('f').onsubmit = async ev=>{
    ev.preventDefault(); const pw = $('pw').value; $('lg').disabled = true;
    try{
      const r = await rpc('bonus_login', {p_pass:pw});
      st.mode = r.mode;
      if (r.mode==='admin'){ st.pass = pw; st.token = null; st.ev = null; save(); showAdmin(); }
      else { st.pass = null; st.token = r.token; st.ev = r.evaluator; save(); showList(); }
    }catch(e){ showLogin(errMsg(e)); }
  };
}

// ===================== 評価者：共通ヘッダー =====================
function topBar(){
  return `<header class="top"><span class="ttl">社員評価</span>
    ${st.ev?`<span class="who">${esc(st.ev.name)}（${ROLES[st.ev.role]}）</span>`:''}<span class="sp"></span>
    <button class="btn small" id="out">ログアウト</button></header>`;
}
function bindTop(){
  $('out').onclick = logout;
}
// ===================== 評価者：対象者一覧 =====================
function showList(refresh=true){ guard(async()=>{
  if (refresh || !st.list){ loading(); st.list = await rpc('bonus_user_list', {p_token:st.token}); }
  const L = st.list;
  if (!L.period){
    $app.innerHTML = topBar() + `<main class="narrow"><div class="card"><h2>評価期間が設定されていません</h2><p class="sub">管理者に連絡してください。</p></div></main>`;
    bindTop(); return;
  }
  const wps = [...new Set(L.employees.map(e=>e.workplace).filter(Boolean))];
  const done = L.employees.filter(e=>e.mine).length;
  const fixed = L.employees.filter(e=>e.result).length;
  $app.innerHTML = topBar() + `<main class="wide">
    <div class="card"><h2>${esc(L.period.name)}</h2>
      <p class="sub">対象者を選んで評価を入力してください。自分が評価した対象者は、3名（マネージャー・次長・事業部）の評価が揃うと結果を閲覧できます。</p>
      <div class="stats mt"><div class="stat"><b>${done}</b><span>入力済み</span></div><div class="stat"><b>${fixed}</b><span>結果確定</span></div></div>
    </div>
    <div class="row" style="margin-bottom:12px">
      <label class="sbox"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="名前で検索（例：山田）" value="${esc(st.q)}" autocomplete="off" aria-label="名前で検索"></label>
      ${wps.length?`<select id="wp"><option value="">すべての事業所</option>${wps.map(w=>`<option ${w===st.wp?'selected':''}>${esc(w)}</option>`).join('')}</select>`:''}
      <select id="ust"><option value="">すべての状況</option><option value="todo" ${st.ust==='todo'?'selected':''}>未入力のみ</option><option value="wait" ${st.ust==='wait'?'selected':''}>入力済（評価待ち）</option><option value="done" ${st.ust==='done'?'selected':''}>結果確定</option></select>
    </div>
    <p class="hit" id="hit"></p>
    <div class="list" id="rows"></div></main>`;
  bindTop();
  $('q').oninput = e=>{ st.q = e.target.value; renderRows(); };
  if ($('wp')) $('wp').onchange = e=>{ st.wp = e.target.value; renderRows(); };
  $('ust').onchange = e=>{ st.ust = e.target.value; renderRows(); };
  renderRows();
});}
function renderRows(){
  const L = st.list, q = norm(st.q);
  const stOf = e => e.result ? 'done' : e.mine ? 'wait' : (e.taken ? 'other' : 'todo');
  const rows = L.employees.filter(e=>(!q || norm(e.name).includes(q)) && (!st.wp || e.workplace===st.wp) && (!st.ust || stOf(e)===st.ust));
  $('hit').textContent = `${rows.length}名を表示中（全${L.employees.length}名）`;
  $('rows').innerHTML = rows.length ? rows.map(e=>{
    let right;
    if (e.result){ const c = calc(e.result.items, e.result.ded); right = `<span class="muted" style="font-size:14px">${f1(c.total)}点</span><b class="rk ${c.rank}">${c.rank}</b>`; }
    else if (e.mine) right = `<span class="badge">入力済・他の評価待ち</span>`;
    else if (e.taken) right = `<span class="badge gray">他の${ROLES[L.role]}が担当</span>`;
    else right = `<span class="badge warn">未入力</span>`;
    return `<button class="emp ${e.taken&&!e.mine?'off':''}" data-id="${e.id}"><span class="grow"><span class="nm">${esc(e.name)}</span><br><span class="wp">${esc(empSub(e))}</span></span><span class="st">${right}</span></button>`;
  }).join('') : '<p class="muted">該当する対象者がいません</p>';
  $('rows').querySelectorAll('.emp').forEach(b=>b.onclick = ()=>{
    const e = L.employees.find(x=>x.id===Number(b.dataset.id));
    if (e.result) showResult(e);

      ...ROLE_ORDER.map(r=>x.by[r]?x.by[r].evaluator:''), ...ROLE_ORDER.map(r=>x.by[r]?x.by[r].s.reduce((a,b)=>a+b,0):'')]);
  });
  const blob = new Blob(['\uFEFF' + lines.map(l=>l.map(csvCell).join(',')).join('\r\n')], {type:'text/csv'});

async function readFileText(file){
  const buf = await file.arrayBuffer();
  try{ return new TextDecoder('utf-8', {fatal:true}).decode(buf); }
  catch(e){ return new TextDecoder('shift_jis').decode(buf); }
}
function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(f); f=''; }
    else if (c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if (c!=='\r') f+=c;
  }
  if (f!=='' || row.length){ row.push(f); rows.push(row); }
  return rows;
}

function genPass(){
  const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
  const a = new Uint32Array(10); crypto.getRandomValues(a);
  return Array.from(a, x=>chars[x % chars.length]).join('');
}

  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" style="max-width:420px"><h2>パスワードを設定しました</h2>
    <p class="sub">${esc(name)} さんのパスワードです。この画面を閉じると二度と表示できないので、控えてから本人に伝えてください。</p>
    <div style="font-size:26px;font-weight:800;letter-spacing:2px;text-align:center;background:var(--bg);border-radius:10px;padding:14px;margin:14px 0;font-family:ui-monospace,Menlo,monospace">${esc(pw)}</div>
    <div class="row"><button class="btn" id="pcopy">コピー</button><button class="btn primary" id="pclose">控えたので閉じる</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#pcopy').onclick = ()=>{ navigator.clipboard.writeText(pw).then(()=>toast('コピーしました'), ()=>toast('コピーできませんでした', true)); };
  return new Promise(res=>{ m.querySelector('#pclose').onclick = ()=>{ m.remove(); res(); }; });
}
async function setEvalPass(v){
  const input = prompt(`${v.name} さんのパスワードを設定します。\n\n・空欄のままOK → 自動生成（おすすめ）\n・自分で決める場合は8文字以上で入力\n\n設定すると、以前のパスワードは使えなくなります。`, '');
  if (input === null) return false;
  const pw = input.trim() || genPass();
  await rpc('bonus_admin_set_evaluator_password', {p_admin:st.pass, p_id:v.id, p_new:pw});
  await showPassModal(v.name, pw);
  return true;
}
function admEvr(){
  const A = st.adm; let editId = null;
  const noPw = A.evaluators.filter(v=>v.active && !v.has_password).length;
  $('pane').innerHTML = `<div class="card"><h2 id="vh">評価者を追加</h2>
      <div class="row"><input type="text" id="vn" placeholder="氏名"><select id="vr">${ROLE_ORDER.map(r=>`<option value="${r}">${ROLES[r]}</option>`).join('')}</select><button class="btn primary" id="vs">追加</button><button class="btn" id="vc" style="display:none">取消</button></div>
      <p class="sub mt">対象者1名につき、マネージャー・次長・事業部から各1名が評価します。減点項目は事業部のみ入力できます。追加すると続けてパスワードを設定します。</p></div>
    ${noPw?`<div class="note" style="background:var(--warn-soft);color:var(--warn)">パスワード未設定の評価者が${noPw}名います。未設定の人はログインできません。「PW設定」から設定してください。</div>`:''}
    <div class="card"><h2>登録済み（${A.evaluators.length}名）</h2><div class="scroll"><table style="min-width:520px"><thead><tr><th>氏名</th><th>役職</th><th>状態</th><th>パスワード</th><th></th></tr></thead><tbody>
      ${A.evaluators.map(v=>`<tr><td>${esc(v.name)}</td><td>${ROLES[v.role]}</td><td>${v.active?'<span class="badge">有効</span>':'<span class="badge gray">無効</span>'}</td>
        <td>${v.has_password?'<span class="badge">設定済</span>':'<span class="badge warn">未設定</span>'}</td>
        <td class="n"><button class="btn small" data-pw="${v.id}">PW${v.has_password?'再設定':'設定'}</button> <button class="btn small" data-ed="${v.id}">編集</button> <button class="btn small" data-tg="${v.id}">${v.active?'無効化':'有効化'}</button></td></tr>`).join('') || '<tr><td colspan="5" class="muted">まだ登録がありません</td></tr>'}
    </tbody></table></div>
    <p class="sub mt">パスワードは暗号化して保存されるため、後から確認することはできません。忘れた場合は「PW再設定」で新しく発行してください。</p></div>`;
  $('vc').onclick = ()=>{ editId=null; $('vn').value=''; $('vh').textContent='評価者を追加'; $('vs').textContent='追加'; $('vc').style.display='none'; };
  $('vs').onclick = ()=>guard(async()=>{
    const n = $('vn').value.trim(); if(!n){ toast('氏名を入力してください', true); return; }
    const cur = editId ? A.evaluators.find(v=>v.id===editId) : null;
    const id = await rpc('bonus_admin_save_evaluator', {p_admin:st.pass, p_id:editId, p_name:n, p_role:$('vr').value, p_active:cur?cur.active:true});
    if (!editId){ toast('追加しました'); await setEvalPass({id, name:n}); }
    else toast('更新しました');
    showAdmin();
  });
  document.querySelectorAll('#pane [data-pw]').forEach(b=>b.onclick = ()=>guard(async()=>{
    const v = A.evaluators.find(x=>x.id===Number(b.dataset.pw));
    if (await setEvalPass(v)) showAdmin();
  }));
  document.querySelectorAll('#pane [data-ed]').forEach(b=>b.onclick = ()=>{
    const v = A.evaluators.find(x=>x.id===Number(b.dataset.ed)); editId = v.id;
    $('vn').value = v.name; $('vr').value = v.role; $('vh').textContent = '評価者を編集'; $('vs').textContent = '更新'; $('vc').style.display = ''; window.scrollTo({top:0,behavior:'smooth'});
  });
  document.querySelectorAll('#pane [data-tg]').forEach(b=>b.onclick = ()=>guard(async()=>{
    const v = A.evaluators.find(x=>x.id===Number(b.dataset.tg));
    await rpc('bonus_admin_save_evaluator', {p_admin:st.pass, p_id:v.id, p_name:v.name, p_role:v.role, p_active:!v.active});
    toast(v.active?'無効にしました（ログインできなくなります）':'有効にしました'); showAdmin();
  }));
}

function admPer(){
  const A = st.adm;
  $('pane').innerHTML = `<div class="card"><h2>新しい評価期間を作成</h2>
      <div class="row"><input type="text" id="pn" placeholder="例：2027年 上期"><button class="btn primary" id="pc">作成して切り替え</button></div>
      <p class="sub mt">評価者は「現在の期間」に対して入力します。過去の期間の評価は残り、評価状況タブで切り替えて確認できます。</p></div>
    <div class="card"><h2>期間一覧</h2><table><tbody>
      ${A.periods.map(p=>`<tr><td>${esc(p.name)}</td><td class="n">${p.id===A.active_period_id?'<span class="badge">現在の期間</span>':`<button class="btn small" data-act="${p.id}">現在の期間にする</button>`}</td></tr>`).join('')}
    </tbody></table></div>`;
  $('pc').onclick = ()=>guard(async()=>{
    const n = $('pn').value.trim(); if(!n){ toast('期間名を入力してください', true); return; }
    if (!confirm(`「${n}」を作成し、現在の期間に切り替えます。よろしいですか？`)) return;
    const id = await rpc('bonus_admin_create_period', {p_admin:st.pass, p_name:n});
    st.admPeriod = id; toast('作成しました'); showAdmin();
  });
  document.querySelectorAll('#pane [data-act]').forEach(b=>b.onclick = ()=>guard(async()=>{
    await rpc('bonus_admin_set_period', {p_admin:st.pass, p_id:Number(b.dataset.act)});
    st.admPeriod = Number(b.dataset.act); toast('切り替えました'); showAdmin();
  }));
}

function admSet(){
  $('pane').innerHTML = `<div class="card"><h2>管理者パスワードの変更</h2><p class="sub">ログイン画面でこのパスワードを入れると管理画面が開きます。評価者のパスワードは「評価者」タブで1人ずつ設定します。</p>
      <label class="lb">新しいパスワード（12文字以上を推奨）</label><input type="password" id="a1" autocomplete="new-password">
      <label class="lb">確認のためもう一度</label><input type="password" id="a2" autocomplete="new-password">
      <button class="btn primary wide" id="as">変更する</button></div>`;
  const go = (kind, a, b)=>guard(async()=>{
    const p1 = $(a).value, p2 = $(b).value;
    if (p1 !== p2){ toast('確認用と一致しません', true); return; }
    await rpc('bonus_admin_set_password', {p_admin:st.pass, p_kind:kind, p_new:p1});
    if (kind==='admin'){ st.pass = p1; save(); }
    $(a).value = $(b).value = ''; toast('変更しました');
  });
  $('as').onclick = ()=>go('admin','a1','a2');
}

// ===================== 起動 =====================
(function start(){
  if (!CONFIGURED){
    $app.innerHTML = `<div class="center"><div class="card login"><h1>社員評価</h1><p class="err">接続先が設定されていません。<br>index.html の SUPABASE_URL と SUPABASE_ANON_KEY を設定してください。</p></div></div>`;
    return;
  }
  load();
  if (st.mode==='admin' && st.pass) return showAdmin();
  if (st.mode==='user' && st.token && st.ev) return showList();
  showLogin();
})();
</script>
</body>
